Plugins {
 id 'com.android.application'
 id 'kotlin-android'
// id 'com.android.library'
 // ADDED: Apply the Google Services plugin, which was defined at the top level
// id 'google.gms.google-services'
 // ADDED: Apply the Firebase Crashlytics plugin, which was defined at the top level
 //id 'google.firebase.crashlytics'
}

android {
compileSdk 36
namespace "com.smarttechnologies.app.blackoverlay"

defaultConfig {
applicationId "com.smarttechnologies.app.blackoverlay"
minSdk 30
targetSdk 36
versionCode 1
versionName "1.0"

testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
}

buildTypes {
release {
minifyEnabled false
proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
}
}
compileOptions {
sourceCompatibility JavaVersion.VERSION_17//JavaVersion.VERSION_1_8
targetCompatibility JavaVersion.VERSION_17
}
kotlinOptions { //Required with the org.jetbrains.kotlin.android plugin
jvmTarget = "17"
}
buildFeatures {
viewBinding true
}
}
def kotlinVersion = "2.2.20"
dependencies {
implementation 'androidx.annotation:annotation:1.8.0'//Last compatible

// Required for useSimpleSummaryProvider attribute in preferences.xml
implementation 'androidx.preference:preference-ktx:1.2.1'//WORKING

// Required for AppCompatActivity and general AndroidX compatibility
implementation 'androidx.appcompat:appcompat:1.7.1' // WORKING

// Essential for modern full-screen control (WindowCompat, WindowInsetsControllerCompat)
// REVERTED to OLD version to maintain build stability
implementation 'androidx.core:core-ktx:1.13.1'

// For ActivityResultLauncher and ActivityResultContracts
// REVERTED to OLD version to maintain build stability
implementation 'androidx.activity:activity-ktx:1.9.0'

// For Material Design components (FloatingActionButton, Toolbar, TabLayout, etc.)
implementation 'com.google.android.material:material:1.12.0'

// For ConstraintLayout
implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

// I plan to use Fragments for the tabs
implementation 'androidx.fragment:fragment-ktx:1.8.9'
implementation 'androidx.viewpager2:viewpager2:1.1.0'

// Existing test dependencies
testImplementation 'junit:junit:4.13.2'
androidTestImplementation 'androidx.test.ext:junit:1.3.0' // WORKING
androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0' //WORKING
// Kotlin Standard Library
implementation 'org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion'
}
